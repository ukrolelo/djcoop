<!-- Progress bar -->
<div class="progress wizard-progress mb-4">
    <div id="wizardProgress" class="progress-bar" role="progressbar" 
         style="width: {% widthratio current_step 4 100 %}%" 
         aria-valuenow="{% widthratio current_step 4 100 %}" 
         aria-valuemin="0" 
         aria-valuemax="100"></div>
</div>

<!-- Step indicators -->
<div class="step-indicators d-flex justify-content-between mb-4">
    <div class="step {% if current_step >= 1 %}active{% endif %}" data-step="1">
        1. Select Servers
    </div>
    <div class="step {% if current_step >= 2 %}active{% endif %}" data-step="2">
        2. Check Prerequisites
    </div>
    <div class="step {% if current_step >= 3 %}active{% endif %}" data-step="3">
        3. Select Databases
    </div>
    <div class="step {% if current_step >= 4 %}active{% endif %}" data-step="4">
        4. Replication Overview
    </div>
</div>
